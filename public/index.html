<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCAdv – Sistema de Automação</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222538;
    --border: #2e3148;
    --accent: #4f6ef7;
    --accent2: #7c3aed;
    --green: #10b981;
    --orange: #f59e0b;
    --red: #ef4444;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 56px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: white; }
  .logo-text { font-weight: 700; font-size: 16px; }
  .logo-sub { font-size: 11px; color: var(--text3); font-weight: 400; }
  .header-badges { display: flex; gap: 8px; align-items: center; }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-green { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
  .badge-blue { background: rgba(79,110,247,0.15); color: var(--accent); border: 1px solid rgba(79,110,247,0.3); }

  /* Layout */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar */
  .sidebar {
    width: 340px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
  .sidebar-title { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
  .sidebar-count { font-size: 11px; color: var(--text3); }
  .task-list { flex: 1; overflow-y: auto; padding: 8px; }
  .task-list::-webkit-scrollbar { width: 4px; }
  .task-list::-webkit-scrollbar-track { background: transparent; }
  .task-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .task-card {
    padding: 14px 16px; border-radius: 10px; margin-bottom: 6px;
    cursor: pointer; border: 1px solid transparent;
    transition: all 0.15s ease; position: relative;
  }
  .task-card:hover { background: var(--surface2); border-color: var(--border); }
  .task-card.active { background: var(--surface2); border-color: var(--accent); }
  .task-card.done { opacity: 0.6; }

  .task-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .task-tipo { font-size: 12px; font-weight: 600; color: var(--accent); }
  .task-prazo { font-size: 11px; color: var(--text3); }
  .task-prazo.urgente { color: var(--red); font-weight: 600; }
  .task-devedor { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-processo { font-size: 11px; color: var(--text3); font-family: 'SF Mono', monospace; }
  .task-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .task-valor { font-size: 12px; color: var(--green); font-weight: 600; }
  .task-status { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .status-pendente { background: rgba(245,158,11,0.15); color: var(--orange); border: 1px solid rgba(245,158,11,0.3); }
  .status-gerando { background: rgba(79,110,247,0.15); color: var(--accent); border: 1px solid rgba(79,110,247,0.3); }
  .status-concluido { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
  .urgente-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); position: absolute; top: 14px; right: 14px; box-shadow: 0 0 6px var(--red); }

  /* Detail Panel */
  .detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .detail-empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--text3);
  }
  .detail-empty-icon { font-size: 48px; opacity: 0.3; }
  .detail-empty-text { font-size: 14px; }

  .detail-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* Detail Header */
  .detail-header { padding: 20px 28px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .detail-tipo { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .detail-processo { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .detail-meta { display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
  .meta-item { display: flex; flex-direction: column; gap: 2px; }
  .meta-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .meta-value { font-size: 13px; color: var(--text); font-weight: 500; }
  .meta-value.green { color: var(--green); }
  .meta-value.orange { color: var(--orange); }
  .meta-value.red { color: var(--red); }

  /* Detail Body */
  .detail-body { display: flex; flex: 1; overflow: hidden; }
  .detail-left { width: 320px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
  .detail-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .info-section { margin-bottom: 20px; }
  .info-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .info-text { font-size: 13px; color: var(--text2); line-height: 1.6; }
  .decisao-box { background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--orange); border-radius: 8px; padding: 12px; font-size: 12px; color: var(--text2); line-height: 1.6; font-style: italic; }

  /* Generation Area */
  .gen-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .gen-toolbar { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .btn { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.15s ease; display: flex; align-items: center; gap: 6px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover:not(:disabled) { background: #3b5bf0; transform: translateY(-1px); }
  .btn-success { background: var(--green); color: white; }
  .btn-success:hover:not(:disabled) { background: #059669; transform: translateY(-1px); }
  .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-outline:hover:not(:disabled) { background: var(--surface2); }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid transparent; }
  .btn-ghost:hover:not(:disabled) { background: var(--surface2); border-color: var(--border); }

  .gen-status { margin-left: auto; font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }

  .gen-output { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .gen-output::-webkit-scrollbar { width: 4px; }
  .gen-output::-webkit-scrollbar-track { background: transparent; }
  .gen-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .petition-text { font-family: 'Times New Roman', serif; font-size: 14px; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
  .cursor { display: inline-block; width: 2px; height: 16px; background: var(--accent); margin-left: 2px; vertical-align: middle; animation: blink 0.8s step-end infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  .placeholder-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text3); }
  .placeholder-icon { font-size: 36px; opacity: 0.3; }

  /* Toast */
  .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
  .toast { padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; display: flex; align-items: flex-start; gap: 10px; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: slideIn 0.2s ease; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .toast-success { background: #064e3b; border: 1px solid #065f46; color: #a7f3d0; }
  .toast-info { background: #1e3a8a; border: 1px solid #1e40af; color: #bfdbfe; }
  .toast-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .toast-body { display: flex; flex-direction: column; gap: 3px; }
  .toast-title { font-weight: 700; }
  .toast-desc { font-size: 12px; opacity: 0.8; }

  /* Projuris sim label */
  .projuris-header {
    background: var(--surface2); border-bottom: 1px solid var(--border);
    padding: 6px 20px; display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--text3); flex-shrink: 0;
  }
  .projuris-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">FC</div>
    <div>
      <div class="logo-text">FCAdv – Sistema de Automação</div>
      <div class="logo-sub">Recuperação de Crédito · TJSP</div>
    </div>
  </div>
  <div class="header-badges">
    <a href="/projects.html" class="badge badge-blue" style="text-decoration:none;cursor:pointer;">⚙ Projetos</a>
    <span class="badge badge-green">● Claude API Conectado</span>
    <span class="badge badge-blue">Projuris ADV</span>
  </div>
</header>

<div class="main">
  <!-- Sidebar: Task Queue -->
  <div class="sidebar">
    <div class="projuris-header">
      <div class="projuris-dot"></div>
      Projuris ADV — Fila de Tarefas
    </div>
    <div class="sidebar-header">
      <div class="sidebar-title">Tarefas Pendentes</div>
      <div class="sidebar-count" id="taskCount">Carregando...</div>
    </div>
    <div class="task-list" id="taskList">
      <div style="padding: 20px; text-align: center; color: var(--text3); font-size: 13px;">Carregando tarefas...</div>
    </div>
  </div>

  <!-- Detail Panel -->
  <div class="detail" id="detailPanel">
    <div class="detail-empty" id="emptyState">
      <div class="detail-empty-icon">⚖️</div>
      <div class="detail-empty-text">Selecione uma tarefa na fila</div>
    </div>
    <div class="detail-content" id="detailContent" style="display:none;">
      <!-- Filled dynamically -->
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
let tasks = [];
let currentTask = null;
let currentEventSource = null;
let generatedText = {};
let taskStatuses = {};

async function loadTasks() {
  const res = await fetch('/api/tasks');
  tasks = await res.json();
  renderTaskList();
}

function renderTaskList() {
  const list = document.getElementById('taskList');
  const pending = tasks.filter(t => t.status !== 'concluido').length;
  document.getElementById('taskCount').textContent = `${pending} pendente${pending !== 1 ? 's' : ''} · ${tasks.length} total`;

  list.innerHTML = tasks.map(t => {
    const status = taskStatuses[t.id] || t.status;
    const isUrgente = t.urgente;
    const prazoClass = isUrgente ? 'urgente' : '';
    const statusLabel = status === 'gerando' ? 'Gerando...' : status === 'concluido' ? 'Concluído' : 'Pendente';
    const statusClass = `status-${status === 'gerando' ? 'gerando' : status === 'concluido' ? 'concluido' : 'pendente'}`;
    return `
      <div class="task-card ${currentTask?.id === t.id ? 'active' : ''} ${status === 'concluido' ? 'done' : ''}" onclick="selectTask('${t.id}')">
        ${isUrgente ? '<div class="urgente-dot"></div>' : ''}
        <div class="task-top">
          <div class="task-tipo">${t.tipo}</div>
          <div class="task-prazo ${prazoClass}">⏱ ${t.prazo}</div>
        </div>
        <div class="task-devedor">${t.cliente || t.devedor || '—'}</div>
        <div class="task-processo">${t.processoNumero || t.processo}</div>
        <div class="task-bottom">
          <div class="task-valor">${t.valor || t.processo}</div>
          <div class="task-status ${statusClass}">${statusLabel}</div>
        </div>
      </div>
    `;
  }).join('');
}

async function selectTask(id) {
  const res = await fetch(`/api/tasks/${id}`);
  currentTask = await res.json();
  renderDetail();
  renderTaskList();
}

const GENERATABLE = ['petição','peticao','recurso','agravo','embargos','contrarrazões','contrarrazoes','impugnação','impugnacao','réplica','replica'];
function isGeneratable(tipo) {
  const t = (tipo || '').toLowerCase();
  return GENERATABLE.some(k => t.includes(k));
}

function renderDetail() {
  const t = currentTask;
  const status = taskStatuses[t.id] || t.status;
  const hasPetition = !!generatedText[t.id];
  const canGenerate = isGeneratable(t.tipo);

  document.getElementById('emptyState').style.display = 'none';
  const content = document.getElementById('detailContent');
  content.style.display = 'flex';
  content.style.flexDirection = 'column';
  content.style.overflow = 'hidden';
  content.style.height = '100%';

  const prazoColor = t.urgente ? 'red' : 'orange';

  content.innerHTML = `
    <div class="detail-header">
      <div class="detail-tipo">${t.fase || t.processoNumero || t.processo}</div>
      <div class="detail-processo">${t.tipo} · ${t.processoNumero || t.processo}</div>
      <div class="detail-meta">
        <div class="meta-item">
          <span class="meta-label">Cliente</span>
          <span class="meta-value">${t.cliente || t.devedor || '—'}</span>
        </div>
        ${t.devedor && t.devedor !== t.cliente ? `
        <div class="meta-item">
          <span class="meta-label">Executado</span>
          <span class="meta-value">${t.devedor}</span>
        </div>` : ''}
        ${t.valor ? `
        <div class="meta-item">
          <span class="meta-label">Valor</span>
          <span class="meta-value green">${t.valor}</span>
        </div>` : ''}
        <div class="meta-item">
          <span class="meta-label">Prazo</span>
          <span class="meta-value ${prazoColor}">${t.prazo || '—'}</span>
        </div>
        ${t.prazoFatal ? `
        <div class="meta-item">
          <span class="meta-label">Fatal</span>
          <span class="meta-value red">${t.prazoFatal}</span>
        </div>` : ''}
        <div class="meta-item">
          <span class="meta-label">Responsáveis</span>
          <span class="meta-value">${(t.responsaveis || []).join(', ') || t.tribunal || '—'}</span>
        </div>
      </div>
    </div>

    <div class="detail-body">
      <div class="detail-left">
        <div class="info-section">
          <div class="info-label">Contexto da Tarefa</div>
          <div class="info-text">${t.descricao}</div>
        </div>
        ${t.decisao ? `
        <div class="info-section">
          <div class="info-label">Decisão Agravada</div>
          <div class="decisao-box">${t.decisao}</div>
        </div>` : ''}
        ${t.recurso_devedor ? `
        <div class="info-section">
          <div class="info-label">Razões do Recorrente</div>
          <div class="decisao-box">${t.recurso_devedor}</div>
        </div>` : ''}
        <div class="info-section">
          <div class="info-label">Base de Conhecimento FCAdv</div>
          <div class="info-text" style="font-size:12px;">
            <span style="color:#888;">●</span> Google Drive – pendente configuração<br>
            <span style="color:var(--green);">●</span> e-SAJ – documentos do processo<br>
            <span style="color:var(--green);">●</span> Claude API conectada
          </div>
        </div>
      </div>

      <div class="detail-right">
        <div class="gen-toolbar">
          <button class="btn btn-primary" id="btnGerar" onclick="generatePetition()" ${(status === 'gerando' || !canGenerate) ? 'disabled' : ''} title="${!canGenerate ? 'Este tipo de tarefa não é gerado automaticamente' : ''}">
            ${status === 'gerando' ? '⏳ Gerando...' : '✦ Gerar Petição'}
          </button>
          <button class="btn btn-outline" id="btnDownload" onclick="downloadDocx()" ${!hasPetition ? 'disabled' : ''}>
            ↓ Baixar .docx
          </button>
          <button class="btn btn-success" id="btnRevisao" onclick="criarRevisao()" ${!hasPetition ? 'disabled' : ''}>
            ✓ Criar Tarefa de Revisão
          </button>
          <div class="gen-status" id="genStatus" style="display:none;">
            <div class="pulse"></div>
            Claude gerando peça...
          </div>
        </div>
        <div class="gen-area">
          <div class="gen-output" id="genOutput">
            ${hasPetition
              ? `<div class="petition-text">${escapeHtml(generatedText[t.id])}</div>`
              : `<div class="placeholder-state">
                  <div class="placeholder-icon">📄</div>
                  <div>Clique em "Gerar Petição" para iniciar</div>
                </div>`
            }
          </div>
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function generatePetition() {
  if (!currentTask) return;

  const taskId = currentTask.id;
  taskStatuses[taskId] = 'gerando';
  generatedText[taskId] = '';
  renderDetail();
  renderTaskList();

  const output = document.getElementById('genOutput');
  output.innerHTML = '<div class="petition-text" id="petitionOutput"></div>';

  const statusEl = document.getElementById('genStatus');
  if (statusEl) statusEl.style.display = 'flex';

  let charCount = 0;

  currentEventSource = new EventSource(`/api/generate/${taskId}`);

  currentEventSource.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if (data.type === 'text') {
      generatedText[taskId] += data.text;
      charCount += data.text.length;
      const el = document.getElementById('petitionOutput');
      if (el) {
        el.innerHTML = escapeHtml(generatedText[taskId]) + '<span class="cursor"></span>';
        output.scrollTop = output.scrollHeight;
      }
      if (statusEl) statusEl.textContent = `✦ Gerando... ${charCount} caracteres`;
    }

    if (data.type === 'done') {
      currentEventSource.close();
      taskStatuses[taskId] = 'concluido';
      const el = document.getElementById('petitionOutput');
      if (el) el.innerHTML = escapeHtml(generatedText[taskId]);
      renderDetail();
      renderTaskList();
      showToast('success', 'Petição gerada com sucesso', `${currentTask.tipo} · ${currentTask.processo}`);
    }

    if (data.type === 'error') {
      currentEventSource.close();
      taskStatuses[taskId] = 'pendente';
      showToast('error', 'Erro ao gerar petição', data.message);
      renderDetail();
    }
  };

  currentEventSource.onerror = () => {
    currentEventSource.close();
  };
}

async function downloadDocx() {
  if (!currentTask) return;
  window.location.href = `/api/download/${currentTask.id}`;
  showToast('info', 'Download iniciado', `${currentTask.tipo}.docx`);
}

async function criarRevisao() {
  if (!currentTask) return;
  const res = await fetch(`/api/tasks/${currentTask.id}/revisao`, { method: 'POST' });
  const data = await res.json();
  if (data.success) {
    showToast('success', 'Tarefa de Revisão criada no Projuris', `Responsável: Dr. Fernando Cota · Prazo: ${currentTask.prazo}`);
    // Simulate transfer message
    setTimeout(() => {
      showToast('info', 'Tarefa original transferida', 'Prazo protocolado? Se sim, concluir esta tarefa.');
    }, 800);
  }
}

function showToast(type, title, desc) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
  toast.className = `toast toast-${type === 'error' ? 'info' : type}`;
  toast.innerHTML = `
    <div class="toast-icon">${icon}</div>
    <div class="toast-body">
      <div class="toast-title">${title}</div>
      ${desc ? `<div class="toast-desc">${desc}</div>` : ''}
    </div>
  `;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; toast.style.transition = 'all 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 4000);
}

loadTasks();
</script>
</body>
</html>
